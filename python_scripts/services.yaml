llmtool_demo:
  name: LLM Tool Demo
  description: Normalize demo input and return helper data to the LLM Tool Script.
  fields:
    name:
      description: Optional name to greet.
      example: Alex

llmtool_entity_index:
  name: LLM Tool Entity Index
  description: Validate Entity Index input and shape matching labeled entities.
  fields:
    labels:
      description: >
        Internal helper input from script label_names. Comma-separated supported
        query label names.
      example: TemperatureSensor,Thermostat
    location:
      description: >
        Required location filter: inside, outside, or everywhere.
      example: inside
    entity_scope:
      description: >
        Entity scope: filtered_by_labels or all. all returns all available
        Entity Index entities for the chosen location.
      example: filtered_by_labels
    label_operator:
      description: >
        Label operator for filtered_by_labels: AND or OR. Empty means AND.
      example: AND
    verbosity:
      description: >
        Response size: id_only, compact, or detailed.
      example: compact
    state_filter:
      description: Optional exact canonical Home Assistant state string.
      example: "on"
    limit:
      description: >
        Optional maximum returned entities. Default 50, maximum 1000.
      example: "50"

llmtool_calculator:
  name: LLM Tool Calculator
  description: Validate Calculator input and return deterministic arithmetic.
  fields:
    operation:
      description: >
        Arithmetic operation: sum, difference, product, quotient, minimum,
        maximum, or average.
      example: average
    values:
      description: >
        Comma-separated decimal numbers without units. Use "." as decimal
        separator, independent of locale settings.
      example: 21.5,22,20.8
    precision:
      description: Optional decimal places for rounding. Use 0 through 10.
      example: "2"

llmtool_date_calculator:
  name: LLM Tool Date Calculator
  description: Validate Date Calculator input and return deterministic calendar calculations.
  fields:
    operation:
      description: >
        Date Calculator operation: duration_between_dates,
        date_by_adding_segments, weekday_for_date, next_matching_date,
        list_calendar_days, epoch_to_date, or date_to_epoch.
      example: weekday_for_date
    date:
      description: >
        Local Home Assistant date or anchor date in format YYYY-MM-DD HH:MM:SS.
      example: "2026-06-21 09:30:00"
    date2:
      description: >
        Second local Home Assistant date in format YYYY-MM-DD HH:MM:SS.
      example: "2026-06-22 09:30:00"
    segments:
      description: >
        Comma-separated integer key=value offsets. Supported keys: years,
        months, days, hours, minutes, seconds.
      example: months=1,days=-2,hours=3
    month:
      description: Optional month for next_matching_date. Use 1 through 12.
      example: "6"
    weekday:
      description: Exact English weekday name.
      example: Monday
    day_of_month:
      description: Day of month, 1 through 31.
      example: "31"
    hour:
      description: Optional hour for next_matching_date. Use 0 through 23.
      example: "0"
    minute:
      description: Optional minute for next_matching_date. Use 0 through 59.
      example: "0"
    second:
      description: Optional second for next_matching_date. Use 0 through 59.
      example: "0"
    epoch_time_s:
      description: Unix epoch seconds.
      example: "0"
    limit:
      description: >
        Optional maximum returned calendar days. Default 366, maximum 3660.
      example: "366"

llmtool_calendar_manager:
  name: LLM Tool Calendar Manager
  description: >
    Validate Calendar Manager input, prepare calendar.get_events requests, and
    shape returned calendar events.
  fields:
    mode:
      description: >
        Helper mode: prepare validates input and builds the calendar request;
        shape validates and shapes the calendar.get_events response.
      example: prepare
    operation:
      description: >
        Calendar Manager operation: search_events, list_upcoming, or
        list_range.
      example: list_upcoming
    calendar_entity_ids:
      description: >
        Comma-separated Home Assistant calendar.* entity IDs. Empty means all
        available calendar.* entities.
      example: calendar.family,calendar.garbage
    keyword:
      description: >
        Required for search_events. Case-insensitive exact phrase matched
        against event title, description, and location.
      example: dentist
    start_time:
      description: >
        Start of the Calendar Manager Time Range for search_events and
        list_range. Use local Home Assistant time in format YYYY-MM-DD HH:MM:SS.
      example: "2026-06-22 00:00:00"
    end_time:
      description: >
        End of the Calendar Manager Time Range for search_events and
        list_range. Use local Home Assistant time in format YYYY-MM-DD HH:MM:SS.
      example: "2026-06-23 00:00:00"
    days_ahead:
      description: >
        Future search window for list_upcoming. Default 31, maximum 365.
      example: "31"
    limit:
      description: >
        Optional maximum returned events across all calendars. Default 100,
        maximum 1000.
      example: "100"
    event_type:
      description: >
        Event type filter: all, all_day, or timed.
      example: all
    verbosity:
      description: >
        Response detail: compact or detailed.
      example: compact

llmtool_weather_forecast:
  name: LLM Tool Weather Forecast
  description: >
    Validate Weather Forecast input, prepare weather.get_forecasts requests,
    and shape returned forecast rows.
  fields:
    mode:
      description: >
        Helper mode: prepare validates input and builds the weather request;
        shape validates and shapes the weather.get_forecasts response.
      example: prepare
    weather_entity_id:
      description: Exact Home Assistant weather.* entity ID.
      example: weather.home
    forecast_type:
      description: >
        Forecast type: daily or hourly.
      example: daily
    start_time:
      description: >
        Local Home Assistant start time in format YYYY-MM-DD HH:MM:SS.
      example: "2026-07-25 00:00:00"
    end_time:
      description: >
        Local Home Assistant end time in format YYYY-MM-DD HH:MM:SS.
      example: "2026-07-27 00:00:00"
    verbosity:
      description: >
        Response detail: overview or detailed. Empty means overview.
      example: overview
    limit:
      description: >
        Optional maximum returned forecast rows. Default 24, maximum 168.
      example: "24"
    prepared:
      description: Internal prepared request data for shape mode.
    weather_response:
      description: Internal Home Assistant weather.get_forecasts response.

llmtool_media_manager:
  name: LLM Tool Media Manager
  description: >
    Validate Media Manager input, prepare Music Assistant and media_player
    actions, and shape the response.
  fields:
    mode:
      description: >
        Helper mode: prepare validates input and builds the action plan; shape
        validates and shapes the action response.
      example: prepare
    operation:
      description: >
        Media Manager operation: search, browse_library, play_by_uri,
        play_by_name, get_queue, transfer_queue, set_playback_mode,
        group_join, group_unjoin, or group_clear_members.
      example: search
    query:
      description: Search text for search and optional library search text.
      example: Bohemian Rhapsody
    search_media_types:
      description: >
        Comma-separated search media types. Empty means
        track,album,artist,playlist,radio.
      example: track,album
    media_type:
      description: Required media type for browse_library or play_by_name.
      example: playlist
    artist:
      description: Optional artist text for precise track or album search.
      example: Queen
    album:
      description: Optional album text for precise track or album search.
      example: A Night at the Opera
    library_only:
      description: For search. If true, search only the Music Assistant library.
      example: "false"
    favorite:
      description: For browse_library. If true, list favorite library items.
      example: "false"
    limit:
      description: Optional result limit for search, browse_library, and get_queue.
      example: "20"
    offset:
      description: Offset for browse_library pagination.
      example: "0"
    album_type:
      description: For browse_library with media_type=album. album, single, ep, or compilation.
      example: album
    player_entity_id:
      description: >
        Music Assistant media_player.* entity ID for playback or get_queue.
        Home Assistant media_player.* entity ID for set_playback_mode.
      example: media_player.kitchen
    media_uris:
      description: Newline-separated Music Assistant media URIs for play_by_uri.
      example: spotify://track/example
    play_queries:
      description: Newline-separated Music Assistant play queries for play_by_name.
      example: Lady Gaga - Aura
    enqueue:
      description: For playback. replace, next, add, or play. Empty means replace.
      example: replace
    radio_mode:
      description: For playback. If true, start radio mode from exactly one media URI or play query.
      example: "false"
    shuffle_mode:
      description: For set_playback_mode. on or off.
      example: "on"
    repeat:
      description: For set_playback_mode. off, all, or one.
      example: "all"
    source_player_entity_id:
      description: Source Music Assistant media_player.* entity ID for transfer_queue.
      example: media_player.kitchen
    target_player_entity_id:
      description: Target Music Assistant media_player.* entity ID for transfer_queue.
      example: media_player.living_room
    auto_play:
      description: For transfer_queue. Empty means true.
      example: "true"
    leader_entity_id:
      description: >
        Home Assistant media_player.* entity ID for group_join and
        group_clear_members.
      example: media_player.living_room
    member_entity_ids:
      description: >
        Comma-separated Home Assistant media_player.* member entity IDs for
        group_join and group_unjoin.
      example: media_player.kitchen,media_player.bedroom
    ungroup_first:
      description: >
        For group_join only. Unjoin the leader and final members before joining.
      example: "false"
    replace_existing:
      description: >
        For group_join only. Unjoin current non-leader members before joining.
      example: "false"
    current_group_members:
      description: >
        Internal helper input from state_attr(leader_entity_id, 'group_members').
      example: media_player.living_room,media_player.kitchen
    helper_config_entry_id:
      description: Internal Music Assistant Instance helper value.
      example: 01ABC
    helper_config_entry_id_is_music_assistant_loaded:
      description: Internal validation flag for helper_config_entry_id.
      example: "true"
    music_assistant_config_entry_ids:
      description: Internal discovered Music Assistant config entry IDs.
      example: 01ABC
    player_entity_id_is_music_assistant:
      description: Internal validation flag for player_entity_id.
      example: "true"
    source_player_entity_id_is_music_assistant:
      description: Internal validation flag for source_player_entity_id.
      example: "true"
    target_player_entity_id_is_music_assistant:
      description: Internal validation flag for target_player_entity_id.
      example: "true"
    prepared:
      description: Internal prepared action data for shape mode.
    action_response:
      description: Internal Home Assistant action response for shape mode.

llmtool_memory_manager:
  name: LLM Tool Memory Manager
  description: >
    Validate Memory Manager input, read the Memory Store Entity, prepare writes,
    and shape the response.
  fields:
    operation:
      description: >
        Memory Manager operation: remember, search, read, update, forget,
        inspect_inventory, list_recent, or status.
      example: remember
    memory_id:
      description: >
        Memory ID for read, update, and forget.
      example: m000001
    topic:
      description: >
        Broad Memory Topic. Required for remember, optional for search and
        update.
      example: school
    tags:
      description: >
        Comma-separated Memory Tags. Required for remember, optional for
        search and update.
      example: schedule,kid_one
    tag_match_mode:
      description: >
        Search tag matching: all or any. Empty means all.
      example: all
    query:
      description: >
        Lexical search text matched against Memory Entry text, topic, and tags.
      example: school starts today
    text:
      description: >
        Memory Entry text for remember and full replacement text for update.
      example: School starts at 08:10 on regular weekdays.
    limit:
      description: >
        Optional maximum returned entries for search and list_recent. Default
        10, maximum 100.
      example: "10"

llmtool_long_term_aggregated_statistics:
  name: LLM Tool Long-Term Aggregated Statistics
  description: >
    Validate Long-Term Aggregated Statistics input, call recorder statistics,
    and shape the response.
  fields:
    entity_ids:
      description: >
        Internal helper input from script entity_ids. Comma-separated Home
        Assistant entity IDs.
      example: sensor.living_room_temperature,sensor.bedroom_temperature
    start_time:
      description: >
        Local Home Assistant start time in format YYYY-MM-DD HH:MM:SS.
      example: "2025-07-30 14:00:00"
    end_time:
      description: >
        Optional local Home Assistant end time in format YYYY-MM-DD HH:MM:SS.
        Empty means now.
      example: "2025-07-31 14:00:00"
    aggregation_type:
      description: >
        Statistic value to return: mean, min, max, or change.
      example: mean
    aggregation_period:
      description: >
        Statistics period: 5minute, hour, day, week, month, year, or total.
      example: hour

llmtool_raw_entity_history:
  name: LLM Tool Raw Entity History
  description: >
    Validate Raw Entity History input, prepare the REST history request, and
    shape the history response.
  fields:
    mode:
      description: >
        Helper mode: prepare validates input and builds the REST request; shape
        validates and shapes the REST response.
      example: prepare
    base_url:
      description: >
        Home Assistant base URL used by prepare mode to build History REST API
        URL parameters.
      example: http://localhost:8123
    entity_ids:
      description: >
        Comma-separated Home Assistant entity IDs.
      example: binary_sensor.window,sensor.living_room_temperature
    start_time:
      description: >
        Local Home Assistant start time in format YYYY-MM-DD HH:MM:SS.
      example: "2026-06-20 10:00:00"
    end_time:
      description: >
        Optional local Home Assistant end time in format YYYY-MM-DD HH:MM:SS.
        Empty means now.
      example: "2026-06-20 12:00:00"
    limit:
      description: >
        Optional maximum returned history entries across all requested entities.
        Default 100, maximum 1000.
      example: "100"
