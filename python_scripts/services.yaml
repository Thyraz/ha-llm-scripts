llmtool_demo:
  name: LLM Tool Demo
  description: Normalize demo input and return helper data to the LLM Tool Script.
  fields:
    name:
      description: Optional name to greet.
      example: Alex

llmtool_entity_index:
  name: LLM Tool Entity Index
  description: Validate Entity Index input and shape matching labeled entities.
  fields:
    labels:
      description: >
        Internal helper input from script label_names. Comma-separated supported
        query label names.
      example: TemperatureSensor,Thermostat
    location:
      description: >
        Required location filter: inside, outside, or everywhere.
      example: inside
    query_mode:
      description: >
        Query scope: by_labels or all_labeled. all_labeled returns all
        available entities for the chosen location.
      example: by_labels
    match_mode:
      description: >
        Multi-label matching for by_labels: all or any.
      example: all
    verbosity:
      description: >
        Response size: id_only, compact, or detailed.
      example: compact
    state_filter:
      description: Optional exact Home Assistant state string.
      example: "on"
    limit:
      description: >
        Optional maximum returned entities. Default 50, maximum 1000.
      example: "50"

llmtool_calculator:
  name: LLM Tool Calculator
  description: Validate Calculator input and return deterministic arithmetic.
  fields:
    operation:
      description: >
        Arithmetic operation: sum, difference, product, quotient, minimum,
        maximum, or average.
      example: average
    values:
      description: >
        Comma-separated decimal numbers without units. Use "." as decimal
        separator, independent of locale settings.
      example: 21.5,22,20.8
    precision:
      description: Optional decimal places for rounding. Use 0 through 10.
      example: "2"

llmtool_long_term_aggregated_statistics:
  name: LLM Tool Long-Term Aggregated Statistics
  description: >
    Validate Long-Term Aggregated Statistics input, call recorder statistics,
    and shape the response.
  fields:
    entity_ids:
      description: >
        Internal helper input from script entity_ids. Comma-separated Home
        Assistant entity IDs.
      example: sensor.living_room_temperature,sensor.bedroom_temperature
    start_time:
      description: >
        Local Home Assistant start time in format YYYY-MM-DD HH:MM:SS.
      example: "2025-07-30 14:00:00"
    end_time:
      description: >
        Optional local Home Assistant end time in format YYYY-MM-DD HH:MM:SS.
        Empty means now.
      example: "2025-07-31 14:00:00"
    aggregation_type:
      description: >
        Statistic value to return: mean, min, max, or change.
      example: mean
    aggregation_period:
      description: >
        Statistics period: 5minute, hour, day, week, month, year, or total.
      example: hour

llmtool_raw_entity_history:
  name: LLM Tool Raw Entity History
  description: >
    Validate Raw Entity History input, prepare the REST history request, and
    shape the history response.
  fields:
    mode:
      description: >
        Helper mode: prepare validates input and builds the REST request; shape
        validates and shapes the REST response.
      example: prepare
    base_url:
      description: >
        Home Assistant base URL used by prepare mode to build History REST API
        URL parameters.
      example: http://localhost:8123
    entity_ids:
      description: >
        Comma-separated Home Assistant entity IDs.
      example: binary_sensor.window,sensor.living_room_temperature
    start_time:
      description: >
        Local Home Assistant start time in format YYYY-MM-DD HH:MM:SS.
      example: "2026-06-20 10:00:00"
    end_time:
      description: >
        Optional local Home Assistant end time in format YYYY-MM-DD HH:MM:SS.
        Empty means now.
      example: "2026-06-20 12:00:00"
    limit:
      description: >
        Optional maximum returned history entries across all requested entities.
        Default 100, maximum 1000.
      example: "100"
