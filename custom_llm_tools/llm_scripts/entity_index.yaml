llmtool_entity_index:
  alias: LLM Tool Entity Index
  description: >
    Use Entity Index before other LLM Tools that need Home Assistant entity IDs.

    Many Home Assistant installations have labels for device-categories, rooms,
    floors and more. Combine them and their state with state_filter to find only
    matching entities.

    IMPORTANT: Entity labels representing rooms or floors have to be passed as
    label_names, not as location. Location only accepts inside, outside, or
    everywhere.

    Some sensor states are cumulative totals, for example energy or water
    counters. If a returned entity has value_hint, follow it. For usage over a
    time range, call Long-Term Aggregated Statistics with aggregation_type=change
    instead of answering from the current state.

    Use meta.truncated to decide whether to retry with a narrower query or higher limit.
    On success, read data.entities. On validation failure, use error and data
    to retry.

    Example:
    ```
      query_mode: by_labels
      verbosity: compact
      limit: 50
      location: inside
      label_names: LivingRoom,Light
      state_filter: "on"
      match_mode: all
    ```

    Return value example:
    ```
      success: true
      answer: Found 2 matching entities.
      data:
        entities:
          - entity_id: light.light1
            friendly_name: Light1
            state: "on"
            matched_labels:
              - LivingRoom
              - Light
          - entity_id: light.light2
            friendly_name: Light2
            state: "on"
            matched_labels:
              - LivingRoom
              - Light
      meta:
        tool: llmtool_entity_index
        count: 2
        total: 2
        query_mode: by_labels
        label_names:
          - LivingRoom
          - Light
        location: inside
        match_mode: all
        state_filter: "on"
        verbosity: compact
        limit: 50
    ```
  mode: queued
  max: 2
  fields:
    label_names:
      name: Label names
      description: >
        Comma-separated supported label names. Required when query_mode is
        'by_labels'. Supported labels are configured in Home Assistant and shown
        in the Assistant instructions. (Warning: the values in the example string are just placeholders and might not be available in your system, check the instructions for the actual supported labels.)
      required: false
      example: TemperatureSensor,Light
      selector:
        text:
    location:
      name: Location
      description: >
        Required location filter: `inside` the house, `outside` the house, or
        `everywhere` which returns matching entities regardless of their
        inside/outside location.
      required: true
      example: inside
      selector:
        select:
          options:
            - inside
            - outside
            - everywhere
    query_mode:
      name: Query mode
      description: >
        by_labels requires parameter 'label_names'. all_labeled returns all available
        entities for the chosen location (inventory lookup).
      required: false
      default: by_labels
      example: by_labels
      selector:
        select:
          options:
            - by_labels
            - all_labeled
    match_mode:
      name: Match mode
      description: >
        For by_labels with multiple label names, 'all' requires that an entity has EVERY label name provided
        and 'any' requires that at least one label name matches the entity's labels.
      required: false
      default: all
      example: all
      selector:
        select:
          options:
            - all
            - any
    verbosity:
      name: Verbosity
      description: >
        'id_only' returns entity IDs, compact returns common fields, detailed adds
        safe operational fields.
      required: false
      default: compact
      example: compact
      selector:
        select:
          options:
            - id_only
            - compact
            - detailed
    state_filter:
      name: State filter
      description: >
        Optional exact Home Assistant state string to filter the search results. Empty means no state filter.
        If you don't know the possible states for entities of a specific label, fetch the entities first without state_filter and rerun the tool call afterwards with the correct state_filter.
        A few examples: Windows might be "on" when open and "off" when closed,
        Lights are "on" when switched on and "off" when switched off, a
        TemperatureSensor might not have a state where a filter makes sense.
      required: false
      example: "on"
      selector:
        text:
    limit:
      name: Limit
      description: Optional maximum returned entities. Default 50. Maximum 1000.
      required: false
      default: 50
      example: "50"
      selector:
        number:
          min: 1
          max: 1000
          mode: box
  sequence:
    # Query labels come from an optional user-owned input_select helper.
    # If the helper is missing, all HA labels except the internal labels are usable.
    - alias: Define Entity Index label source
      variables:
        query_label_source_entity_id: input_select.llmtool_entity_index_labels
        visibility_label_name: Everywhere
        inside_label_name: Inside
        outside_label_name: Outside

    # Build the supported query label list from one source of truth.
    - alias: Gather supported query labels
      variables:
        known_label_names: >
          {% set hidden_label_names = [visibility_label_name, inside_label_name, outside_label_name] %}
          {% set configured_label_names = state_attr(query_label_source_entity_id, 'options') %}
          {% set ns = namespace(items=[]) %}
          {% if configured_label_names is not none %}
            {% for label_name_text in configured_label_names %}
              {% set label_name_text = label_name_text | trim %}
              {% if label_name_text and label_id(label_name_text) and label_name_text not in hidden_label_names and label_name_text not in ns.items %}
                {% set ns.items = ns.items + [label_name_text] %}
              {% endif %}
            {% endfor %}
          {% else %}
            {% for label_id_text in labels() %}
              {% set label_name_text = label_name(label_id_text) %}
              {% if label_name_text and label_name_text not in hidden_label_names and label_name_text not in ns.items %}
                {% set ns.items = ns.items + [label_name_text] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.items | sort | to_json }}

    # Normalize input names and resolve them to HA's internal label IDs.
    - alias: Prepare candidate labels
      variables:
        raw_label_names: "{{ label_names if label_names is string else '' }}"
        query_mode_raw: "{{ query_mode | default('by_labels', true) }}"
        location_raw: "{{ location | default('', true) }}"
        user_label_names: >
          {% set parts = raw_label_names.split(',') %}
          {% set ns = namespace(items=[]) %}
          {% for part in parts %}
            {% set label_name_text = part | trim %}
            {% if label_name_text %}
              {% set ns.items = ns.items + [label_name_text] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}
        location_label_name: >-
          {% if location_raw == 'inside' %}{{ inside_label_name }}{% elif location_raw == 'outside' %}{{ outside_label_name }}{% else %}{{ '' }}{% endif %}
        location_label_id: >-
          {% if location_label_name %}{{ label_id(location_label_name | trim) | default('', true) }}{% else %}{{ '' }}{% endif %}
        visibility_label_id: "{{ label_id(visibility_label_name) | default('', true) }}"
        match_label_names: >
          {% set ns = namespace(items=[]) %}
          {% if query_mode_raw == 'all_labeled' %}
            {% for label_name_text in known_label_names %}
              {% set ns.items = ns.items + [label_name_text] %}
            {% endfor %}
          {% else %}
            {% for label_name_text in user_label_names %}
              {% if label_name_text not in ns.items %}
                {% set ns.items = ns.items + [label_name_text] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.items }}

    # Ask Home Assistant for visible candidates only.
    - alias: Gather candidate entity IDs
      variables:
        candidate_entity_ids: >
          {% set ns = namespace(items=[]) %}
          {% if visibility_label_id %}
            {% for entity_id in label_entities(visibility_label_id) %}
              {% if entity_id not in ns.items %}
                {% set ns.items = ns.items + [entity_id] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.items }}

    # Gather one safe record shape. The helper decides final verbosity.
    - alias: Gather candidate records
      variables:
        candidate_records_json: >
          {% set ns = namespace(items=[]) %}
          {% for entity_id in candidate_entity_ids %}
            {% set matched = namespace(labels=[]) %}
            {% for label_name_text in match_label_names %}
              {% set resolved_label_id = label_id(label_name_text) %}
              {% if resolved_label_id and entity_id in label_entities(resolved_label_id) %}
                {% set matched.labels = matched.labels + [label_name_text] %}
              {% endif %}
            {% endfor %}
            {% set unit = state_attr(entity_id, 'unit_of_measurement') %}
            {% set device_class = state_attr(entity_id, 'device_class') %}
            {% set state_class = state_attr(entity_id, 'state_class') %}
            {% if unit is none %}
              {% set unit_text = '' %}
            {% else %}
              {% set unit_text = unit | string %}
            {% endif %}
            {% if device_class is none %}
              {% set device_class_text = '' %}
            {% else %}
              {% set device_class_text = device_class | string %}
            {% endif %}
            {% if state_class is none %}
              {% set state_class_text = '' %}
            {% else %}
              {% set state_class_text = state_class | string %}
            {% endif %}
            {% set record = {
              'entity_id': entity_id,
              'matched_labels': matched.labels,
              'visibility_matched': visibility_label_id and entity_id in label_entities(visibility_label_id),
              'location_matched': not location_label_name or (location_label_id and entity_id in label_entities(location_label_id)),
              'state': states(entity_id),
              'friendly_name': state_attr(entity_id, 'friendly_name') | default(entity_id, true),
              'domain': entity_id.split('.')[0],
              'area_id': area_id(entity_id) | default('', true),
              'device_id': device_id(entity_id) | default('', true),
              'unit_of_measurement': unit_text,
              'device_class': device_class_text,
              'state_class': state_class_text
            } %}
            {% set ns.items = ns.items + [record] %}
          {% endfor %}
          {{ ns.items | to_json }}

    # Validate, match, sort, limit, and shape the response in Python.
    - alias: Call Entity Index Python Helper
      action: python_script.llmtool_entity_index
      data:
        labels: "{{ raw_label_names }}"
        location: "{{ location | default('', true) }}"
        query_mode: "{{ query_mode | default('by_labels', true) }}"
        match_mode: "{{ match_mode | default('all', true) }}"
        verbosity: "{{ verbosity | default('compact', true) }}"
        state_filter: "{{ state_filter | default('', true) }}"
        limit: "{{ limit | default('', true) }}"
        known_labels: "{{ known_label_names }}"
        visibility_label: "{{ visibility_label_name }}"
        inside_label: "{{ inside_label_name }}"
        outside_label: "{{ outside_label_name }}"
        candidates: "{{ candidate_records_json | from_json }}"
      response_variable: entity_index_helper

    # Own the final LLM Tool response in the Home Assistant script.
    - alias: Build structured response
      choose:
        - conditions:
            - condition: template
              value_template: "{{ entity_index_helper.success }}"
          sequence:
            - variables:
                entity_index_response:
                  success: true
                  answer: "{{ entity_index_helper.answer }}"
                  data: "{{ entity_index_helper.data }}"
                  meta: "{{ entity_index_helper.meta }}"
      default:
        - variables:
            entity_index_response:
              success: false
              error: "{{ entity_index_helper.error }}"
              data: "{{ entity_index_helper.data }}"
              meta: "{{ entity_index_helper.meta }}"

    # Return the structured response to the caller.
    - stop: LLM Tool Entity Index complete
      response_variable: entity_index_response
